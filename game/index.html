<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Palms</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14111a;
    color: #fff4df;
  }
  body {
    margin: 0;
    background: #14111a;
    color: #fff4df;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* The canvas fills the window; the game letterboxes its 16:9 frame inside it. */
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #171420;
    cursor: crosshair;
    touch-action: none;
    outline: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Sunset Palms: an open coastal city. Move on foot with WASD or the arrow keys, hold Shift to run, aim with the mouse, and press P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
