<!doctype html>
<!-- Sunset Palms page shell: one fixed full-window canvas (#game) that the game letterboxes to
     16:9, a hidden #status live region for announcements, and the module entry ./src/main.js.
     The CSS only frames the page; every pixel inside the canvas is drawn by the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Palms</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14111a;
    color: #fff4df;
  }
  body {
    margin: 0;
    background: #14111a;
    color: #fff4df;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* The canvas fills the window; the game letterboxes its 16:9 frame inside it. */
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #171420;
    cursor: crosshair;
    touch-action: none;
    outline: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Sunset Palms: an open coastal crime story with an eight-job mission chain, street races, a delivery run, a rampage, hidden packages, traffic, pedestrians and police. On the title screen choose Continue, New Game or Controls with the arrow keys and Enter, or click a row. Move on foot with WASD, hold Shift to run, press E to take or leave a car, drive with W and S, steer with A and D, use Space as the handbrake, aim with the mouse and fire with the left button, open the city map with Tab, mute with M, and pause with P or Escape."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
